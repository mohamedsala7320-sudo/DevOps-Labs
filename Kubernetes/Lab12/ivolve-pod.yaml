apiVersion: v1
kind: Pod
metadata:
  name: ivolve-app-pod
  namespace: ivolve
spec:
  containers:
  - name: app-container
    image: nginx:latest
    env:
      - name: DB_HOST
        valueFrom:
          configMapKeyRef:
            name: ivolve-cm
            key: DB_HOST
      - name: DB_USER
        valueFrom:
          configMapKeyRef:
            name: ivolve-cm
            key: DB_USER
      - name: DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: ivolve-secret
            key: DB_PASSWORD
      - name: MYSQL_ROOT_PASSWORD
        valueFrom:
          secretKeyRef:
            name: ivolve-secret
            key: MYSQL_ROOT_PASSWORD
