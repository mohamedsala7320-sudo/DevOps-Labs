apiVersion: apps/v1
kind: Deployment
metadata:
  name: demoapp
  namespace: demo
  labels:
    app: demoapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demoapp
  template:
    metadata:
      labels:
        app: demoapp
    spec:
      containers:
        - name: demoapp
          image: mosala7320/demoapp:latest
          ports:
            - containerPort: 8080
